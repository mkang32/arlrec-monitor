name: tail-snapshot
# Daily snapshot during the post-registration tail (May 16 - July 10). After
# registration closes, most state changes happen slowly (cancellations,
# waitlist promotions, late add/drops); hourly polling is overkill. After
# July 10 we stop entirely — every section will have started by then and be
# locked as Unavailable.

on:
  schedule:
    - cron: "0 12 16-31 5 *"          # daily 12:00 UTC (8am ET) — May 16 to 31
    - cron: "0 12 * 6 *"              # daily 12:00 UTC — all of June
    - cron: "0 12 1-10 7 *"           # daily 12:00 UTC — July 1 to 10
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Full catalog snapshot with enrollment counts
        # Was `--mode types` (metadata-only). That bumped sections.last_seen but
        # wrote NO status snapshots, so any section that fell out of the
        # registrationevent filters below (Arlington drops/changes reg_event
        # tags after the hot window — see CLAUDE.md "reg_event is unstable")
        # silently stopped accruing snapshots while still appearing live in the
        # web app. `--mode catalog` iterates ALL_TYPES with counts; since every
        # section carries a type_code it reaches the stranded sections too. The
        # event passes below remain for reg_event refresh + a fresher count on
        # the sections they still match.
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m scraper.scrape --mode catalog

      - name: Scrape all three registration events
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -e
          for ev in ENJOYSUMMER1 ENJOYSUMMER2 ENJOYSUMMER; do
            python -m scraper.scrape --mode event --event "$ev"
          done

      - name: Render CSV + HTML
        run: python -m scraper.dump

      - name: Commit snapshot + dumps
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # See ambient.yml for the rationale: preserve sqlite, discard locally-
          # generated dumps, pull to get any newer dump.py, regenerate, commit.
          attempt_commit() {
            cp data/snapshots.sqlite /tmp/local-snapshots.sqlite
            git checkout -- data/ index.html 2>/dev/null || true
            git pull --rebase --no-stat -q
            cp /tmp/local-snapshots.sqlite data/snapshots.sqlite
            python -m scraper.dump
            git add data/ arlington-va/2026-summer/dashboard/index.html
            if git diff --staged --quiet; then
              echo "no change"; return 0
            fi
            git commit -m "tail $(date -u +%FT%TZ)"
            git push -q
          }
          attempt_commit || attempt_commit || (echo "commit retries exhausted"; exit 1)

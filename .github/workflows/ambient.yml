name: ambient-snapshot
# Hourly polling during the active registration period (May 11-15 for
# summer 2026, Aug 4-6 for fall 2026). The dedicated hot-window workflow
# takes over for the minute-by-minute polling at noon ET; both can safely
# overlap because of the concurrency group below.
#
# Outside those windows, daily polling is handled by tail.yml, after which
# nothing runs — every class will be Unavailable by then.

on:
  schedule:
    - cron: "0 * 11-15 5 *"           # hourly, May 11-15 (summer 2026)
    - cron: "0 * 4-6 8 *"             # hourly, Aug 4-6 (fall 2026)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick season based on UTC date
        id: pick
        run: |
          DATE=$(date -u +%m%d)
          case "$DATE" in
            0511|0512|0513|0514|0515)
              echo "season=arlington-2026-summer" >> "$GITHUB_OUTPUT"
              echo "events=ENJOYSUMMER1 ENJOYSUMMER2 ENJOYSUMMER" >> "$GITHUB_OUTPUT"
              echo "out_html=arlington-va/2026-summer/dashboard/index.html" >> "$GITHUB_OUTPUT"
              ;;
            0804|0805|0806)
              echo "season=arlington-2026-fall" >> "$GITHUB_OUTPUT"
              echo "events=ENJOYFALL1 ENJOYFALL2 ENJOYFALL" >> "$GITHUB_OUTPUT"
              echo "out_html=arlington-va/2026-fall/dashboard/index.html" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Not an ambient window ($DATE) — exiting."
              echo "season=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # NOTE: --mode types is intentionally NOT run here — it adds ~30 type
      # searches (~360 page fetches) per invocation. Combined with the */10 cron
      # during reg days that's ~60k HTTP requests/day, which gets the runner IP
      # 403'd by Cloudflare. tail.yml runs --mode types once a day instead,
      # which is plenty since section taxonomy is stable.

      - name: Scrape this season's registration events
        if: steps.pick.outputs.season != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SEASON: ${{ steps.pick.outputs.season }}
          EVENTS: ${{ steps.pick.outputs.events }}
        run: |
          set -e
          for ev in $EVENTS; do
            python -m scraper.scrape --mode event --event "$ev" --season "$SEASON"
          done

      - name: Render CSV + HTML
        if: steps.pick.outputs.season != ''
        env:
          SEASON: ${{ steps.pick.outputs.season }}
        run: python -m scraper.dump --season "$SEASON"

      - name: Commit snapshot + dumps
        if: steps.pick.outputs.season != ''
        env:
          SEASON: ${{ steps.pick.outputs.season }}
          OUT_HTML: ${{ steps.pick.outputs.out_html }}
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # Robust commit pattern:
          # 1. Stash our scraped sqlite + freshly-generated dumps.
          # 2. Pull latest (gets newer dump.py if any).
          # 3. Restore our scraped sqlite (the only thing we MUST preserve;
          #    CSV+HTML can be regenerated from it).
          # 4. Regenerate dumps with the now-current dump.py.
          # 5. Commit + push, with one pull-and-regen retry on conflict.
          attempt_commit() {
            cp data/snapshots.sqlite /tmp/local-snapshots.sqlite
            # Reset everything that dump.py regenerates (and the raw sqlite,
            # which we restore from /tmp below). Wildcard so newly-added
            # generated files (currently_open.csv, analysis.sqlite, etc.)
            # are reset too without having to update this list each time.
            git checkout -- data/ index.html 2>/dev/null || true
            git pull --rebase --no-stat -q
            cp /tmp/local-snapshots.sqlite data/snapshots.sqlite
            python -m scraper.dump --season "$SEASON"
            git add data/ "$OUT_HTML"
            if git diff --staged --quiet; then
              echo "no change"; return 0
            fi
            git commit -m "ambient $(date -u +%FT%TZ)"
            git push -q
          }
          attempt_commit || attempt_commit || (echo "commit retries exhausted"; exit 1)

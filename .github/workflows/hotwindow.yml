name: hot-window
# Dense polling during the moment a registration window opens.
# Fires ~50 min before noon ET on May 12/13/14 2026, then sleeps until 15:55 UTC
# and polls every ~60s for 30 min, then every ~5 min for another 30 min.
# (GitHub Actions cron is often delayed; firing early + sleeping is the safe pattern.)

on:
  schedule:
    # Primary fire: 15:40 UTC = 11:40 ET (~10 min before noon-ET polling starts).
    # GH Actions sometimes silently drops scheduled events (happened May 12 2026).
    # The :48 entries are belt-and-suspenders backups; if both fire, the second
    # will queue behind the first via the scrape-write concurrency group and run
    # afterwards (extra polling, no harm).
    - cron: "40 15 12 5 *"
    - cron: "48 15 12 5 *"
    - cron: "40 15 13 5 *"
    - cron: "48 15 13 5 *"
    - cron: "40 15 14 5 *"
    - cron: "48 15 14 5 *"
  workflow_dispatch:
    inputs:
      event:
        description: "registrationevent code (e.g. ENJOYSUMMER1)"
        required: true
        type: string
      skip_wait:
        description: "Start polling immediately, don't wait until 15:55 UTC"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-write
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 30 min × 60s + 30 min × 5min + 2 h × 10min = ~3h + setup + buffer
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick event based on UTC date
        id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "event=${{ inputs.event }}" >> "$GITHUB_OUTPUT"
            echo "skip_wait=${{ inputs.skip_wait }}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%m%d)
            case "$DATE" in
              0512) echo "event=ENJOYSUMMER1" >> "$GITHUB_OUTPUT" ;;  # Gymnastics
              0513) echo "event=ENJOYSUMMER2" >> "$GITHUB_OUTPUT" ;;  # Aquatics
              0514) echo "event=ENJOYSUMMER"  >> "$GITHUB_OUTPUT" ;;  # Other
              *)
                echo "Not a registration day ($DATE) — exiting."
                echo "event=" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "skip_wait=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify hot-window started
        if: steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
        run: |
          python3 - <<'PY'
          import os
          from scraper.notify import send_alert
          event = os.environ["EVENT"]
          send_alert(
              subject=f"[ARL-REC] hot-window fired for {event}",
              body=(
                  f"The hot-window cron fired for {event}. "
                  f"The workflow will idle until 15:50 UTC (11:50 ET), then "
                  f"begin minute-by-minute polling.\n"
              ),
          )
          PY

      - name: Poll loop
        if: steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
          SKIP_WAIT: ${{ steps.pick.outputs.skip_wait }}
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          # Wait until 15:50 UTC = 11:50 ET (10 min before registration opens) — unless manually overridden
          if [[ "$SKIP_WAIT" != "true" ]]; then
            while :; do
              HM=$(date -u +%H%M)
              if [[ "$HM" -ge 1550 ]]; then break; fi
              sleep 15
            done
          fi
          echo "Begin dense polling at $(date -u +%FT%TZ) for event $EVENT"

          # During the hot window we only want status (Available/Waitlist/Full/Unavailable)
          # over time — enrollment counts get filled in by the final-counts step
          # below after polling ends. Each iteration is ~5-10s instead of minutes.
          #
          # Robust commit pattern: pull BEFORE editing (so we don't conflict on
          # generated files), then regenerate index.html/CSVs with the latest
          # dump.py, then commit. On push conflict, pull-regenerate-retry once.
          poll_and_commit() {
            # 1. Sync with remote first (cheap; avoids autostash conflicts on
            #    dump-generated files like index.html when UI code changes upstream).
            git pull --rebase --no-stat -q || git rebase --abort 2>/dev/null || true
            # 2. Scrape into the freshly-merged DB.
            python -m scraper.scrape --mode event --event "$EVENT" --skip-counts
            # 3. Regenerate dumps using the just-pulled (possibly newer) dump.py code.
            python -m scraper.dump
            git add data/snapshots.sqlite data/latest.csv data/snapshots.csv index.html
            git diff --staged --quiet && return 0
            git commit -m "hot $(date -u +%FT%TZ) $EVENT"
            if ! git push -q 2>/dev/null; then
              git pull --rebase --no-stat -q || git rebase --abort 2>/dev/null || true
              python -m scraper.dump
              git add data/snapshots.sqlite data/latest.csv data/snapshots.csv index.html
              git diff --staged --quiet || git commit --amend --no-edit
              git push -q || echo "push still failing after one retry; will catch up next iteration"
            fi
          }

          # Phase 1: 30 minutes of ~60s polling
          for i in $(seq 1 30); do
            start=$(date +%s)
            poll_and_commit
            elapsed=$(( $(date +%s) - start ))
            # aim for 60s cadence
            sleep_for=$(( 60 - elapsed ))
            if [[ $sleep_for -gt 0 ]]; then sleep $sleep_for; fi
          done

          # Phase 2: 30 minutes of ~5-min polling
          for i in $(seq 1 6); do
            start=$(date +%s)
            poll_and_commit
            elapsed=$(( $(date +%s) - start ))
            sleep_for=$(( 300 - elapsed ))
            if [[ $sleep_for -gt 0 ]]; then sleep $sleep_for; fi
          done

          # Phase 3: 2 hours of ~10-min polling
          for i in $(seq 1 12); do
            start=$(date +%s)
            poll_and_commit
            elapsed=$(( $(date +%s) - start ))
            sleep_for=$(( 600 - elapsed ))
            if [[ $sleep_for -gt 0 ]]; then sleep $sleep_for; fi
          done

          echo "Hot window polling done at $(date -u +%FT%TZ)"

      # Always run a final pass WITH enrollment counts so the page shows them
      # immediately when polling finishes. `if: always()` ensures this runs even
      # if the poll loop above died (e.g. on a git conflict).
      - name: Final enrollment-counts pass
        if: always() && steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # Reset to a known-good state in case the previous step left a conflict.
          git rebase --abort 2>/dev/null || true
          git reset --hard HEAD -q
          git pull --rebase --no-stat -q
          python -m scraper.scrape --mode event --event "$EVENT"
          python -m scraper.dump
          git add data/snapshots.sqlite data/latest.csv data/snapshots.csv index.html
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "final counts $(date -u +%FT%TZ) $EVENT"
            git push -q || (git pull --rebase --no-stat -q && python -m scraper.dump && git add -A && (git diff --staged --quiet || git commit --amend --no-edit) && git push -q)
          fi

name: hot-window
# Dense polling around the moment a registration window opens.
# Fires ~20 min before noon ET on May 12/13/14 2026, sleeps until 11:50 ET (15:50 UTC),
# then drives through phases pinned to absolute UTC wall-clock times:
#   pre-open  every  60s  until 16:00 UTC (11:50 ET → noon ET)        — baseline
#   phase 0   every  15s  until 16:05 UTC (first 5 min after open)    — explosive moment
#   phase 1   every  60s  until 16:30 UTC                              — fast settling
#   phase 2   every 5min  until 17:00 UTC                              — slow settling
#   phase 3   every 10min until 19:00 UTC                              — long tail
# All iterations use --skip-counts (status only); a final enrollment-counts pass
# runs once at the end via `if: always()`. Ambient cron then catches counts hourly.
# (GitHub Actions cron is often delayed; firing early + sleeping is the safe pattern.)

on:
  schedule:
    # Primary fire: 15:40 UTC = 11:40 ET (~10 min before noon-ET polling starts).
    # GH Actions sometimes silently drops scheduled events (happened May 12 2026).
    # The :48 entries are belt-and-suspenders backups; if both fire, the second
    # will queue behind the first via the scrape-write concurrency group and run
    # afterwards (extra polling, no harm).
    - cron: "40 15 12 5 *"
    - cron: "48 15 12 5 *"
    - cron: "40 15 13 5 *"
    - cron: "48 15 13 5 *"
    - cron: "40 15 14 5 *"
    - cron: "48 15 14 5 *"
    # Fall 2026: same staged pattern, Aug 4/5/6.
    - cron: "40 15 4 8 *"
    - cron: "48 15 4 8 *"
    - cron: "40 15 5 8 *"
    - cron: "48 15 5 8 *"
    - cron: "40 15 6 8 *"
    - cron: "48 15 6 8 *"
  workflow_dispatch:
    inputs:
      event:
        description: "registrationevent code (e.g. ENJOYSUMMER1)"
        required: true
        type: string
      skip_wait:
        description: "Start polling immediately, don't wait until 15:55 UTC"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-write
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 30 min × 60s + 30 min × 5min + 2 h × 10min = ~3h + setup + buffer
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick event based on UTC date
        id: pick
        run: |
          # event -> (season_id, dashboard output path). Mirrors
          # scraper/config.py's EVENT_SEASON + scraper/dump.py's SITE_DIR/season-name
          # mapping — keep in sync if either changes.
          season_for() {
            case "$1" in
              ENJOYSUMMER1|ENJOYSUMMER2|ENJOYSUMMER|CAMP|CAMP1)
                echo "arlington-2026-summer arlington-va/2026-summer/dashboard/index.html" ;;
              ENJOYFALL1|ENJOYFALL2|ENJOYFALL|55FALL)
                echo "arlington-2026-fall arlington-va/2026-fall/dashboard/index.html" ;;
              *)
                echo "unknown event '$1' — add it to season_for() in hotwindow.yml" >&2
                exit 1 ;;
            esac
          }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EVENT="${{ inputs.event }}"
            echo "event=$EVENT" >> "$GITHUB_OUTPUT"
            echo "skip_wait=${{ inputs.skip_wait }}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%m%d)
            case "$DATE" in
              0512) EVENT=ENJOYSUMMER1 ;;  # Gymnastics
              0513) EVENT=ENJOYSUMMER2 ;;  # Aquatics
              0514) EVENT=ENJOYSUMMER  ;;  # Other
              0804) EVENT=ENJOYFALL1   ;;  # Gymnastics
              0805) EVENT=ENJOYFALL2   ;;  # Aquatics
              0806) EVENT=ENJOYFALL    ;;  # Other
              *)
                echo "Not a registration day ($DATE) — exiting."
                echo "event=" >> "$GITHUB_OUTPUT"
                echo "skip_wait=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "event=$EVENT" >> "$GITHUB_OUTPUT"
            echo "skip_wait=false" >> "$GITHUB_OUTPUT"
          fi
          read -r SEASON OUT_HTML <<< "$(season_for "$EVENT")"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "out_html=$OUT_HTML" >> "$GITHUB_OUTPUT"

      - name: Notify hot-window started
        if: steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
        run: |
          python3 - <<'PY'
          import os
          from scraper.notify import send_alert
          event = os.environ["EVENT"]
          send_alert(
              subject=f"[ARL-REC] hot-window fired for {event}",
              body=(
                  f"The hot-window cron fired for {event}. "
                  f"The workflow will idle until 15:50 UTC (11:50 ET), then "
                  f"begin minute-by-minute polling.\n"
              ),
          )
          PY

      - name: Poll loop
        if: steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
          SKIP_WAIT: ${{ steps.pick.outputs.skip_wait }}
          SEASON: ${{ steps.pick.outputs.season }}
          OUT_HTML: ${{ steps.pick.outputs.out_html }}
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          # Wait until 15:50 UTC = 11:50 ET (10 min before registration opens) — unless manually overridden
          if [[ "$SKIP_WAIT" != "true" ]]; then
            while :; do
              HM=$(date -u +%H%M)
              if [[ "$HM" -ge 1550 ]]; then break; fi
              sleep 15
            done
          fi
          echo "Begin dense polling at $(date -u +%FT%TZ) for event $EVENT"

          # Robust commit pattern: pull BEFORE editing (so we don't conflict on
          # generated files), then regenerate index.html/CSVs with the latest
          # dump.py, then commit. On push conflict, pull-regenerate-retry once.
          #
          # poll_and_commit takes one arg: "true" = include enrollment counts
          # (slow, ~130s per iter when most sections are non-Unavailable), or
          # "false" = status only, fast (~6s per iter). Phase 0/1 use false to
          # keep cadence tight around the open moment; Phase 2/3 use true so we
          # get count snapshots every 5-10 min throughout the rest of the window.
          poll_and_commit() {
            local with_counts="${1:-false}"
            local flag=""
            local kind="hot"
            if [[ "$with_counts" != "true" ]]; then
              flag="--skip-counts"
            else
              kind="hot+counts"
            fi
            # 1. Sync with remote first (cheap; avoids autostash conflicts on
            #    dump-generated files like index.html when UI code changes upstream).
            git pull --rebase --no-stat -q || git rebase --abort 2>/dev/null || true
            # 2. Scrape into the freshly-merged DB. Soft-skip if Queue-it gates us:
            #    we're in a virtual waiting room, no data yet, just try again next iter.
            if ! python -m scraper.scrape --mode event --event "$EVENT" --season "$SEASON" $flag; then
              echo "scrape failed this iteration (possibly Queue-it queue); continuing"
              return 0
            fi
            # 3. Regenerate dumps using the just-pulled (possibly newer) dump.py code.
            python -m scraper.dump --season "$SEASON"
            git add data/ "$OUT_HTML"
            git diff --staged --quiet && return 0
            git commit -m "$kind $(date -u +%FT%TZ) $EVENT"
            if ! git push -q 2>/dev/null; then
              git pull --rebase --no-stat -q || git rebase --abort 2>/dev/null || true
              python -m scraper.dump --season "$SEASON"
              git add data/ "$OUT_HTML"
              git diff --staged --quiet || git commit --amend --no-edit
              git push -q || echo "push still failing after one retry; will catch up next iteration"
            fi
          }

          # All phases drive off the UTC wall clock so they fire at fixed
          # moments regardless of cron drift / where we are in the workflow:
          #
          #   pre-open   : 60s polling until 16:00 UTC (registration opens)
          #   phase 0    : 15s polling for 5 min     (16:00 → 16:05 UTC)
          #   phase 1    : 60s polling for 25 min    (16:05 → 16:30 UTC)
          #   phase 2    : 5min polling for 30 min   (16:30 → 17:00 UTC)
          #   phase 3    : 10min polling for 2 hours (17:00 → 19:00 UTC)
          #
          # Comparison via [[ ]] with string < is lexicographic on the 4-digit
          # HHMM, which matches chronological order within a UTC day.
          run_until() {
            local end_hhmm="$1" cadence_s="$2" phase="$3" with_counts="${4:-false}"
            echo "Phase $phase: until $end_hhmm UTC at ${cadence_s}s cadence (counts=$with_counts)"
            while [[ "$(date -u +%H%M)" < "$end_hhmm" ]]; do
              local s=$(date +%s)
              poll_and_commit "$with_counts"
              local sleep_for=$(( cadence_s - ($(date +%s) - s) ))
              [[ $sleep_for -gt 0 ]] && sleep $sleep_for
            done
          }

          run_until "1600" 60  "pre-open"               false
          run_until "1605" 15  "0 (15s, post-open)"     false
          # Quick one-shot count_pass after the explosive open phase, so the page
          # shows the 16:00 hour's enrollment numbers before Phase 2 starts.
          poll_and_commit true
          run_until "1630" 60  "1 (60s)"                false
          run_until "1700" 300 "2 (5min, +counts)"      true
          run_until "1900" 600 "3 (10min, +counts)"     true
          # 19:00 hour final-state is captured by the `Final enrollment-counts pass`
          # step below (runs even if this poll loop crashed).

          echo "Hot window polling done at $(date -u +%FT%TZ)"

      # Always run a final pass WITH enrollment counts so the page shows them
      # immediately when polling finishes. `if: always()` ensures this runs even
      # if the poll loop above died (e.g. on a git conflict).
      - name: Final enrollment-counts pass
        if: always() && steps.pick.outputs.event != ''
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_PASS: ${{ secrets.ALERT_GMAIL_PASS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          EVENT: ${{ steps.pick.outputs.event }}
          SEASON: ${{ steps.pick.outputs.season }}
          OUT_HTML: ${{ steps.pick.outputs.out_html }}
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # Reset to a known-good state in case the previous step left a conflict.
          git rebase --abort 2>/dev/null || true
          git reset --hard HEAD -q
          git pull --rebase --no-stat -q
          python -m scraper.scrape --mode event --event "$EVENT" --season "$SEASON"
          python -m scraper.dump --season "$SEASON"
          git add data/ "$OUT_HTML"
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "final counts $(date -u +%FT%TZ) $EVENT"
            git push -q || (git pull --rebase --no-stat -q && python -m scraper.dump --season "$SEASON" && git add -A && (git diff --staged --quiet || git commit --amend --no-edit) && git push -q)
          fi

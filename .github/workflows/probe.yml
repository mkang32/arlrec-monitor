name: probe
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi
      - run: |
          cat > /tmp/probe.py << 'PY'
          import sys
          from curl_cffi import requests
          profiles = ["chrome124","chrome131","chrome120","safari17_0","safari15_5","firefox133","edge99"]
          url = "https://vaarlingtonweb.myvscloud.com/webtrac/web/search.html?interfaceparameter=WebTrac"
          for p in profiles:
              try:
                  r = requests.get(url, impersonate=p, timeout=15)
                  body_kind = "OK" if "Activity Search" in r.text else ("CF-BLOCK" if "Cloudflare" in r.text else "OTHER")
                  print(f"{p:14} HTTP {r.status_code}  {len(r.text):>6} bytes  {body_kind}")
              except Exception as e:
                  print(f"{p:14} ERROR {e}")
          PY
          python3 /tmp/probe.py
